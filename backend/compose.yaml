services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - netwatch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [netwatch-internal]

  backend:
    build: .
    image: netwatch-backend:3.0.0
    restart: unless-stopped
    init: true
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - netwatch-data:/app/data
    networks: [netwatch-internal, netwatch-ai-network]

volumes:
  netwatch-db:
  netwatch-data:
networks:
  netwatch-internal:
    driver: bridge
  netwatch-ai-network:
    external: true
