services:
  independent-ai-gateway:
    build: .
    image: independent-ai-gateway:3.0.0
    container_name: independent-ai-gateway
    restart: unless-stopped
    env_file: .env
    ports: ["${AI_BIND_ADDRESS:-192.168.111.22}:${AI_HOST_PORT:-3090}:3090"]
    volumes: ["./config/knowledge.yaml:/opt/ai/config/knowledge.yaml:ro"]
    secrets: [groq_api_key]
    networks: [netwatch-ai-network]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
secrets:
  groq_api_key:
    file: ./secrets/groq_api_key
networks:
  netwatch-ai-network:
    external: true
